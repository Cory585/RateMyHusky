name: Review digest

on:
  schedule:
    - cron: "0 13 * * *"  # 13:00 UTC daily: 9:00 Boston in summer, 8:00 in winter
  workflow_dispatch:

# Reads the review queue and sends at most one email; nothing here reads or
# writes the repo through GITHUB_TOKEN. A missing RESEND_API_KEY fails the run
# instead of silently skipping the email.
permissions:
  contents: read

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"  # match ci.yml
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements-data.txt

      - name: Send the review digest
        working-directory: backend
        env:
          ORACLE_DATABASE_URL: ${{ secrets.ORACLE_DATABASE_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: python review_digest.py
