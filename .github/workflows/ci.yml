# CI for every push and PR. Mirrors what the real deploys gate:
#   frontend  -> tsc + vite build (what fails a Vercel deploy)
#   backend   -> pip install + pytest (deps + "does server.py import")
#   backend-pg -> pytest tests/pg against PostgreSQL 16 + pgvector (SSL on)
#   secrets   -> gitleaks over full history + tracked-.env guard
#   legacy    -> PRs only: no added line names the retired review source
# Lint is non-blocking until the existing ESLint errors are cleaned up.
# No repository secrets are used anywhere in this workflow.
name: CI

# Read-only token: no job writes, and this caps what a compromised
# third-party action could do with GITHUB_TOKEN on this public repo.
permissions:
  contents: read

on:
  push:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # Dead address: the prebuild sitemap script degrades to the static
      # sitemap instead of hitting the live prod API on every push.
      - run: npm run build
        env:
          SITEMAP_API_URL: http://127.0.0.1:9

  lint:
    name: Frontend lint (soft)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # Soft check: failures annotate the run but stay green until the
      # pre-existing ESLint errors are fixed, then drop this flag.
      - run: npm run lint
        continue-on-error: true

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest tests -q

  backend-pg:
    name: Backend tests (PostgreSQL)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      # A plain `docker run`, not a service container: services cannot pass
      # server flags, and the connect helpers all require SSL.
      - name: Start PostgreSQL 16 + pgvector
        run: |
          docker run -d --name pg -p 5432:5432 -e POSTGRES_PASSWORD=test \
            pgvector/pgvector:pg16 \
            -c ssl=on \
            -c ssl_cert_file=/etc/ssl/certs/ssl-cert-snakeoil.pem \
            -c ssl_key_file=/etc/ssl/private/ssl-cert-snakeoil.key
      - name: Install PostgreSQL 16 client tools
        run: sudo apt-get update && sudo apt-get install -y postgresql-client-16
      - name: Wait for PostgreSQL
        run: |
          for i in $(seq 1 30); do
            pg_isready -h localhost -p 5432 -U postgres && exit 0
            sleep 2
          done
          docker logs pg
          exit 1
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest tests/pg -q
        env:
          PG_TEST_URL: postgresql://postgres:test@localhost:5432/postgres?sslmode=require

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks (full history)
        run: |
          curl -sSfL -o /tmp/gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          tar -C /tmp -xzf /tmp/gitleaks.tar.gz gitleaks
          /tmp/gitleaks git --redact .
      - name: no tracked .env files
        run: |
          if git ls-files | grep -E '(^|/)\.env(\.|$)' | grep -v '\.example$'; then
            echo "::error::Tracked .env-style file found. Remove it from git and rotate anything inside it."
            exit 1
          fi
          echo "No tracked .env files."

  legacy-terms:
    name: No retired source names in added lines
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python .github/scripts/legacy_terms_guard.py --selftest
      - run: python .github/scripts/legacy_terms_guard.py --base "origin/${{ github.base_ref }}"
